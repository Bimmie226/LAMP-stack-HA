version: "3.8" 

services: 
  db01: 
    image: mariadb:11
    hostname: db01
    networks: 
      - galera
    environment: 
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password 
    secrets: 
      - mariadb_root_password 
    configs: 
      - source: db01_cnf
        target: /etc/mysql/conf.d/db01.cnf
        mode: 0444
    volumes: 
      - db01_data:/var/lib/mysql 
    deploy: 
      replicas: 1
      restart_policy: 
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config: 
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      rollback_config: 
        parallelism: 1
        delay: 10s
      placement: 
        constraints: 
          - node.labels.db == db01 
  db02: 
    image: mariadb:11
    hostname: db02
    networks: 
      - galera
    environment: 
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password 
    secrets: 
      - mariadb_root_password 
    configs: 
      - source: db02_cnf
        target: /etc/mysql/conf.d/db02.cnf
        mode: 0444
    volumes: 
      - db02_data:/var/lib/mysql 
    deploy: 
      replicas: 1
      restart_policy: 
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config: 
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      rollback_config: 
        parallelism: 1
        delay: 10s
      placement: 
        constraints: 
          - node.labels.db == db02

  db03: 
    image: mariadb:11
    hostname: db03
    networks: 
      - galera
    environment: 
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password 
    secrets: 
      - mariadb_root_password 
    configs: 
      - source: db03_cnf
        target: /etc/mysql/conf.d/db03.cnf
        mode: 0444
    volumes: 
      - db03_data:/var/lib/mysql 
    deploy: 
      replicas: 1
      restart_policy: 
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 120s
      update_config: 
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      rollback_config: 
        parallelism: 1
        delay: 10s
      placement: 
        constraints: 
          - node.labels.db == db03 

  maxscale: 
    image: mariadb/maxscale:latest 
    hostname: maxscale_deploy
    networks: 
      - galera
    secrets: 
      - maxscale_password
    configs: 
      - source: maxscale_cnf
        target: /etc/maxscale.cnf
        mode: 0444
    ports: 
      - target: 4000
        published: 4000 
        protocol: tcp
        mode: ingress
      - target: 4001
        published: 4001
        protocol: tcp 
        mode: ingress 
    deploy: 
      replicas: 3
      restart_policy: 
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 60s
      update_config: 
        parallelism: 1
        delay: 20s
        failure_action: rollback
        order: stop-first
      rollback_config: 
        parallelism: 1
        delay: 10s
      placement: 
        max_replicas_per_node: 1

secrets: 
  mariadb_root_password: 
    external: true 
  maxscale_password: 
    external: true 

configs: 
  db01_cnf: 
    external: true
  db02_cnf: 
    external: true
  db03_cnf: 
    external: true 
  maxscale_cnf: 
    external: true 
  nginx_cnf: 
    external: true 

networks: 
  galera: 
    driver: overlay 
    attachable: false 
    driver_opts: 
      encrypted: "true" 

volumes: 
  db01_data: 
    driver: local 
  db02_data: 
    driver: local 
  db03_data: 
    driver: local 
