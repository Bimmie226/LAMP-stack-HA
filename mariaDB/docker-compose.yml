version: "3.9"

services:
  db01:
    image: instantlinux/mariadb-galera:latest
    container_name: db01
    hostname: db01
    environment: 
      MARIADB_ROOT_PASSWORD: root
    volumes: 
      - ./db01/db01.cnf:/etc/mysql/conf.d/db01.cnf
      - db01_data:/var/lib/mysql
    networks: 
      - galera

  db02: 
    image: instantlinux/mariadb-galera:latest
    container_name: db02
    hostname: db02
    environment: 
      MARIADB_ROOT_PASSWORD: root 
    volumes: 
      - ./db02/db02.cnf:/etc/mysql/conf.d/db02.cnf
      - db02_data:/var/lib/mysql
    networks: 
      - galera 

  db03: 
    image: instantlinux/mariadb-galera:latest
    container_name: db03
    hostname: db03
    environment: 
      MARIADB_ROOT_PASSWORD: root 
    volumes: 
      - ./db03/db03.cnf:/etc/mysql/conf.d/db03.cnf
      - db03_data:/var/lib/mysql
    networks: 
      - galera 

  maxscale_01:
    image: mariadb/maxscale:24.02
    container_name: maxscale01
    hostname: maxscale01
    volumes: 
      - ./maxscale/maxscale.cnf:/etc/maxscale.cnf
    ports: 
      - "4001:4000"
      - "4004:4001"
      - "8981:8989"
    depends_on: 
      - db01
      - db02
      - db03
    networks: 
      - galera

  maxscale_02:
    image: mariadb/maxscale:24.02
    container_name: maxscale02
    hostname: maxscale02
    volumes: 
      - ./maxscale/maxscale.cnf:/etc/maxscale.cnf
    ports: 
      - "4002:4000"
      - "4005:4001"
      - "8982:8989"
    depends_on: 
      - db01
      - db02
      - db03
    networks: 
      - galera

  maxscale_03: 
    image: mariadb/maxscale:24.02
    container_name: maxscale03
    hostname: maxscale03
    volumes: 
      - ./maxscale/maxscale.cnf:/etc/maxscale.cnf
    ports: 
      - "4003:4000"
      - "4006:4001"
      - "8983:8989"
    depends_on:
      - db01
      - db02
      - db03
    networks: 
      - galera

volumes: 
  db01_data:
  db02_data:
  db03_data:

networks: 
  galera: 